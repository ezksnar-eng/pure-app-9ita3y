<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #a2e897; /* نفس اللون الأخضر بالضبط */
            font-family: Arial, sans-serif;
            padding-bottom: 20px;
        }

        /* الهيدر الأخضر مع اللوجو */
        .mobile-header {
            background-color: #5ebd50;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #4a9e3f;
        }
        .mobile-header h1 {
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        .menu-icon {
            font-size: 24px;
            color: #000;
            cursor: pointer;
        }

        /* شريط وضع الرابط / البحث */
        .search-container {
            padding: 10px;
            text-align: center;
        }
        .search-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .search-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #777;
            background: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* شبكة الصور - عمودين للموبايل */
        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* عمودين نفس الصورة بالضبط */
            gap: 10px;
            padding: 10px;
        }

        .image-card {
            background: #fff;
            border: 1px solid #888;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 180px;
            overflow: hidden;
        }
        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* شريط إدخال الرابط الخاص بيك */
        .url-bar {
            background: #333;
            color: #fff;
            padding: 8px;
            display: flex;
            gap: 5px;
        }
        .url-bar input {
            flex: 1;
            padding: 5px;
        }
        .url-bar button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <!-- شريط الرابط مالتك -->
    <div class="url-bar">
        <input type="text" id="targetUrl" placeholder="أدخل الرابط هنا...">
        <button onclick="loadData()">عرض</button>
    </div>

    <!-- الهيدر الأخضر -->
    <div class="mobile-header">
        <h1>Rule 34</h1>
        <div class="menu-icon">☰</div>
    </div>

    <!-- مربع البحث -->
    <div class="search-container">
        <div class="search-title">Search</div>
        <input type="text" class="search-input" placeholder="Search tags...">
    </div>

    <!-- معرض الصور (صفين) -->
    <div class="image-grid" id="grid">
        <div class="image-card"><img src="https://via.placeholder.com/150" alt="img"></div>
        <div class="image-card"><img src="https://via.placeholder.com/150" alt="img"></div>
        <div class="image-card"><img src="https://via.placeholder.com/150" alt="img"></div>
        <div class="image-card"><img src="https://via.placeholder.com/150" alt="img"></div>
    </div>

    <script>
        function loadData() {
            const url = document.getElementById('targetUrl').value;
            if(!url) return alert('حط الرابط أولاً');
            console.log("Loading: " + url);
        }
    </script>
</body>
</html>
