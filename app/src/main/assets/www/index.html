<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #a2e897;
            font-family: Arial, sans-serif;
            padding-bottom: 20px;
        }

        .url-bar {
            background: #222;
            color: #fff;
            padding: 8px;
            display: flex;
            gap: 5px;
        }
        .url-bar input {
            flex: 1;
            padding: 6px;
            font-size: 12px;
            border: 1px solid #555;
            background: #fff;
            color: #000;
        }
        .url-bar button {
            padding: 6px 12px;
            background: #5ebd50;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .mobile-header {
            background-color: #5ebd50;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #4a9e3f;
        }
        .mobile-header h1 {
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        .search-container {
            padding: 10px;
            text-align: center;
        }
        .search-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .search-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #777;
            background: #fff;
            font-size: 14px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }

        .image-card {
            background: #fff;
            border: 1px solid #888;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 180px;
            overflow: hidden;
        }
        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .status-msg {
            grid-column: span 2;
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- شريط الرابط -->
    <div class="url-bar">
        <input type="text" id="targetUrl" placeholder="حط الرابط أو اتركها واضغط عرض لتجربة التاغات...">
        <button onclick="loadData()">عرض</button>
    </div>

    <div class="mobile-header">
        <h1>Rule 34</h1>
        <div style="font-size:20px; font-weight:bold;">☰</div>
    </div>

    <div class="search-container">
        <div class="search-title">Search</div>
        <input type="text" id="tagInput" class="search-input" placeholder="اكتب Tag واضغط عرض (مثلاً: cat)...">
    </div>

    <!-- شبكة الصور -->
    <div class="image-grid" id="grid">
        <div class="status-msg">اضغط على زر "عرض" لجلب الصور</div>
    </div>

    <script>
        async function loadData() {
            const grid = document.getElementById('grid');
            const customUrl = document.getElementById('targetUrl').value.trim();
            const tag = document.getElementById('tagInput').value.trim();
            
            grid.innerHTML = '<div class="status-msg">جاري تحميل الصور...</div>';

            // إذا ما حطيت رابط، راح يجيب من الـ API المباشر مالهم حسب الـ Tag
            let fetchUrl = customUrl;
            if (!fetchUrl) {
                const searchTag = tag ? encodeURIComponent(tag) : 'all';
                fetchUrl = `https://api.rule34.xxx/index.php?page=dapi&s=post&q=index&json=1&limit=20&tags=${searchTag}`;
            }

            try {
                // نستخدم بروكسي مجاني لتجاوز حظر CORS بالموبايل
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(fetchUrl)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                let posts = [];
                try {
                    posts = JSON.parse(data.contents);
                } catch(e) {
                    posts = data.contents;
                }

                grid.innerHTML = '';

                if (!posts || posts.length === 0) {
                    grid.innerHTML = '<div class="status-msg">ماكو نتائج أو الرابط غلط!</div>';
                    return;
                }

                posts.forEach(post => {
                    // تجريب استخراج رابط الصورة
                    const imgUrl = post.file_url || post.sample_url || post.preview_url;
                    if (imgUrl) {
                        const card = document.createElement('div');
                        card.className = 'image-card';
                        card.innerHTML = `<img src="${imgUrl}" loading="lazy" onclick="window.open('${imgUrl}', '_blank')">`;
                        grid.appendChild(card);
                    }
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="status-msg">صار خطأ بالسحب! اتأكد من الرابط أو شبكة النت.</div>';
            }
        }
    </script>
</body>
</html>
